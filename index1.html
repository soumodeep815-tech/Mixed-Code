<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Button</title>
    <style>
        .custom-button {
            background-color: #007BFF;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        /* Changes color when the user hovers over the button */
        .custom-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <button class="custom-button">Click Me</button>

</body>
</html>
